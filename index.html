<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BossX Validator Access Dial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    color: #f0a500;
  }

  .vault-container {
    position: relative;
    width: 900px; /* Diperbesar dari 800px untuk menampung cincin baru */
    height: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center center;
  }

  /* Media queries disesuaikan dengan base size 900px */
  @media (max-width: 950px) { .vault-container { transform: scale(0.85); } }
  @media (max-width: 800px) { .vault-container { transform: scale(0.70); } }
  @media (max-width: 680px) { .vault-container { transform: scale(0.55); } }
  @media (max-width: 550px) { .vault-container { transform: scale(0.45); } }

  .guide-line {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 2px;
    height: 450px; /* Diperpanjang sesuai radius baru */
    background: linear-gradient(to bottom, rgba(240,165,0,0.6), transparent);
    z-index: 90;
    pointer-events: none;
    transition: background 0.5s ease;
  }

  .guide-line.active {
    background: linear-gradient(to bottom, rgba(0,255,136,0.6), transparent);
  }

  .guide-line.click-flash {
    width: 4px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(0,255,136,0.8), transparent);
    transition: all 0.08s ease-out;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 1.5s cubic-bezier(0.4, 0.0, 0.2, 1), box-shadow 0.5s ease, border-color 0.5s ease;
  }

  /* 11 Cincin (dari terluar ke terdalam) */
  .ring-10 { /* CINCIN TERLUAR BARU */
    width: 840px; height: 840px;
    background: radial-gradient(circle, transparent 42%, #262650 42%, #262650 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.38);
  }
  .ring-9 {
    width: 760px; height: 760px;
    background: radial-gradient(circle, transparent 42%, #24244a 42%, #24244a 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.35);
  }
  .ring-8 {
    width: 680px; height: 680px;
    background: radial-gradient(circle, transparent 42%, #222240 42%, #222240 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.32);
  }
  .ring-7 {
    width: 620px; height: 620px;
    background: radial-gradient(circle, transparent 42%, #1e1e38 42%, #1e1e38 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.28);
  }
  .ring-6 {
    width: 560px; height: 560px;
    background: radial-gradient(circle, transparent 42%, #1c1c34 42%, #1c1c34 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.25);
  }
  .ring-5 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, transparent 42%, #1a1a2e 42%, #1a1a2e 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.22);
  }
  .ring-4 {
    width: 440px; height: 440px;
    background: radial-gradient(circle, transparent 42%, #181828 42%, #181828 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.2);
  }
  .ring-3 {
    width: 380px; height: 380px;
    background: radial-gradient(circle, transparent 42%, #15152a 42%, #15152a 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.18);
  }
  .ring-2 {
    width: 320px; height: 320px;
    background: radial-gradient(circle, transparent 42%, #121226 42%, #121226 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.15);
  }
  .ring-1 {
    width: 260px; height: 260px;
    background: radial-gradient(circle, transparent 42%, #0f0f22 42%, #0f0f22 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.12);
  }
  .ring-0 {
    width: 200px; height: 200px;
    background: radial-gradient(circle, transparent 42%, #0a0a20 42%, #0a0a20 48%, transparent 48%);
    border: 2px solid rgba(100, 100, 150, 0.1);
  }

  /* Efek Running untuk semua ring */
  .ring.running { border-color: rgba(0, 255, 136, 0.4); }
  .ring-10.running { box-shadow: 0 0 55px rgba(0, 255, 136, 0.2), inset 0 0 40px rgba(0, 255, 136, 0.1); }
  .ring-9.running { box-shadow: 0 0 45px rgba(0, 255, 136, 0.18), inset 0 0 30px rgba(0, 255, 136, 0.08); }
  .ring-8.running { box-shadow: 0 0 40px rgba(0, 255, 136, 0.16), inset 0 0 28px rgba(0, 255, 136, 0.08); }
  .ring-7.running { box-shadow: 0 0 35px rgba(0, 255, 136, 0.14), inset 0 0 25px rgba(0, 255, 136, 0.07); }
  .ring-6.running { box-shadow: 0 0 30px rgba(0, 255, 136, 0.12), inset 0 0 22px rgba(0, 255, 136, 0.06); }
  .ring-5.running { box-shadow: 0 0 26px rgba(0, 255, 136, 0.1), inset 0 0 20px rgba(0, 255, 136, 0.06); }
  .ring-4.running { box-shadow: 0 0 22px rgba(0, 255, 136, 0.09); }
  .ring-3.running { box-shadow: 0 0 18px rgba(0, 255, 136, 0.08); }
  .ring-2.running { box-shadow: 0 0 15px rgba(0, 255, 136, 0.07); }
  .ring-1.running { box-shadow: 0 0 12px rgba(0, 255, 136, 0.06); }
  .ring-0.running { box-shadow: 0 0 10px rgba(0, 255, 136, 0.05); }

  .ring.click-flash {
    border-color: rgba(255, 255, 255, 0.9) !important;
    box-shadow: 0 0 50px rgba(255, 255, 255, 0.5), inset 0 0 35px rgba(0, 255, 136, 0.3) !important;
    transition: all 0.08s ease-out;
  }

  .tick {
    position: absolute;
    width: 1px;
    height: 6px;
    background: rgba(100, 100, 150, 0.3);
    transform-origin: center;
    transition: background 0.5s;
  }

  .ring.running .tick { background: rgba(0, 255, 136, 0.2); }
  .tick.major {
    width: 2px;
    height: 10px;
    background: rgba(100, 100, 150, 0.5);
  }
  .ring.running .tick.major { background: rgba(0, 255, 136, 0.4); }

  .ring-char {
    position: absolute;
    font-size: 13px;
    font-weight: bold;
    color: #444466;
    user-select: none;
    transition: color 0.5s;
    letter-spacing: 1px;
  }

  .ring.running .ring-char {
    color: rgba(0, 255, 136, 0.7);
    text-shadow: 0 0 4px rgba(0, 255, 136, 0.3);
  }

  .ring-char.highlight {
    color: #ffffff !important;
    text-shadow: 0 0 8px #00ff88, 0 0 15px rgba(0, 255, 136, 0.6) !important;
    font-size: 15px;
  }

  @keyframes spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes spin-ccw { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }

  /* 11 animasi spin - semakin ke dalam semakin cepat */
  .ring.running.spin-11 { animation: spin-ccw 45s linear infinite; } /* Baru: Terluar, paling lambat */
  .ring.running.spin-1 { animation: spin-cw 40s linear infinite; }
  .ring.running.spin-2 { animation: spin-ccw 36s linear infinite; }
  .ring.running.spin-3 { animation: spin-cw 32s linear infinite; }
  .ring.running.spin-4 { animation: spin-ccw 28s linear infinite; }
  .ring.running.spin-5 { animation: spin-cw 24s linear infinite; }
  .ring.running.spin-6 { animation: spin-ccw 20s linear infinite; }
  .ring.running.spin-7 { animation: spin-cw 16s linear infinite; }
  .ring.running.spin-8 { animation: spin-ccw 14s linear infinite; }
  .ring.running.spin-9 { animation: spin-cw 12s linear infinite; }
  .ring.running.spin-10 { animation: spin-ccw 10s linear infinite; }

  .center {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, #1a1a2e, #050510);
    border: 2px solid rgba(100, 100, 150, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
    transition: border-color 0.5s, box-shadow 0.5s;
  }

  .center.running {
    border-color: rgba(0, 255, 136, 0.5);
    box-shadow: 0 0 40px rgba(0, 255, 136, 0.2), inset 0 0 20px rgba(0, 255, 136, 0.1);
  }

  .power-btn {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 2px solid rgba(100, 100, 150, 0.4);
    background: radial-gradient(circle at 30% 30%, #2a2a40, #0a0a1a);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.4s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.05);
    position: relative;
  }

  .power-btn:hover {
    transform: scale(1.05);
    border-color: rgba(100, 100, 150, 0.7);
  }

  .power-btn:active {
    transform: scale(0.95);
  }

  .power-btn.running {
    border-color: rgba(0, 255, 136, 0.6);
    background: radial-gradient(circle at 30% 30%, #0a3a2a, #051510);
    box-shadow: 0 0 25px rgba(0, 255, 136, 0.4), inset 0 1px 2px rgba(0, 255, 136, 0.2);
  }

  .power-btn.running:hover {
    border-color: rgba(255, 80, 80, 0.6);
  }

  .power-icon {
    width: 40px;
    height: 40px;
    stroke: #555577;
    stroke-width: 2.5;
    fill: none;
    transition: stroke 0.4s, filter 0.4s;
  }

  .power-btn.running .power-icon {
    stroke: #00ff88;
    filter: drop-shadow(0 0 6px #00ff88);
  }
</style>
</head>
<body>

<div class="vault-container" id="vault">
  <div class="guide-line" id="guideLine"></div>

  <!-- 11 Cincin (dari terluar ke terdalam) -->
  <div class="ring ring-10 spin-11" id="ring-10"></div> <!-- CINCIN TERLUAR BARU -->
  <div class="ring ring-9 spin-1" id="ring-0"></div>
  <div class="ring ring-8 spin-2" id="ring-1"></div>
  <div class="ring ring-7 spin-3" id="ring-2"></div>
  <div class="ring ring-6 spin-4" id="ring-3"></div>
  <div class="ring ring-5 spin-5" id="ring-4"></div>
  <div class="ring ring-4 spin-6" id="ring-5"></div>
  <div class="ring ring-3 spin-7" id="ring-6"></div>
  <div class="ring ring-2 spin-8" id="ring-7"></div>
  <div class="ring ring-1 spin-9" id="ring-8"></div>
  <div class="ring ring-0 spin-10" id="ring-9"></div>

  <div class="center" id="centerDisplay">
    <button class="power-btn" id="powerBtn" onclick="toggleValidator()" aria-label="Toggle Validator">
      <svg class="power-icon" viewBox="0 0 24 24">
        <path d="M12 2 L12 12" stroke-linecap="round"/>
        <path d="M18.36 6.64 A9 9 0 1 1 5.64 6.64" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
let isRunning = false;
let clickInterval = null;
let audioCtx = null;
let animationFrameId = null;
let startTime = 0;

// Karakter campuran huruf besar & kecil (34 karakter total)
const CHARS = '0123456789aBcDeFgHiJkLmNoPqRsTuVwXyZ'.split('');
const CHARS_PER_RING = 24;
// Ditambahkan offset 30 di index 0 untuk cincin terluar baru
const RING_OFFSETS = [30, 0, 3, 6, 9, 12, 15, 18, 21, 24, 27];
const CLICK_INTERVAL_MS = 60000;
const TICKS_PER_RING = 60;

// Kecepatan rotasi (semakin ke dalam semakin cepat)
// Ditambahkan -360 / 45000 di index 0 (terluar, paling lambat, CCW)
const RING_SPEEDS = [
  -360 / 45000,  // Ring 10 (CCW, 840px - paling luar, BARU)
  360 / 40000,   // Ring 9 (CW, 760px)
  -360 / 36000,  // Ring 8 (CCW, 680px)
  360 / 32000,   // Ring 7 (CW, 620px)
  -360 / 28000,  // Ring 6 (CCW, 560px)
  360 / 24000,   // Ring 5 (CW, 500px)
  -360 / 20000,  // Ring 4 (CCW, 440px)
  360 / 16000,   // Ring 3 (CW, 380px)
  -360 / 14000,  // Ring 2 (CCW, 320px)
  360 / 12000,   // Ring 1 (CW, 260px)
  -360 / 10000   // Ring 0 (CCW, 200px - paling dalam)
];

// ==================== AUDIO ENGINE ====================
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playMechanicalClick() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  
  const clickOsc = audioCtx.createOscillator();
  const clickGain = audioCtx.createGain();
  const clickFilter = audioCtx.createBiquadFilter();
  
  clickOsc.type = 'triangle';
  clickOsc.frequency.setValueAtTime(1800, now);
  clickOsc.frequency.exponentialRampToValueAtTime(400, now + 0.05);
  
  clickFilter.type = 'bandpass';
  clickFilter.frequency.value = 1200;
  clickFilter.Q.value = 2;
  
  clickGain.gain.setValueAtTime(0, now);
  clickGain.gain.linearRampToValueAtTime(0.4, now + 0.002);
  clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
  
  clickOsc.connect(clickFilter);
  clickFilter.connect(clickGain);
  clickGain.connect(audioCtx.destination);
  
  clickOsc.start(now);
  clickOsc.stop(now + 0.1);
  
  const thudOsc = audioCtx.createOscillator();
  const thudGain = audioCtx.createGain();
  
  thudOsc.type = 'sine';
  thudOsc.frequency.setValueAtTime(180, now);
  thudOsc.frequency.exponentialRampToValueAtTime(60, now + 0.1);
  
  thudGain.gain.setValueAtTime(0, now);
  thudGain.gain.linearRampToValueAtTime(0.3, now + 0.003);
  thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
  
  thudOsc.connect(thudGain);
  thudGain.connect(audioCtx.destination);
  
  thudOsc.start(now);
  thudOsc.stop(now + 0.2);
  
  const bufferSize = audioCtx.sampleRate * 0.05;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const noiseData = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    noiseData[i] = (Math.random() * 2 - 1) * 0.5;
  }
  
  const noiseSource = audioCtx.createBufferSource();
  const noiseGain = audioCtx.createGain();
  const noiseFilter = audioCtx.createBiquadFilter();
  
  noiseSource.buffer = noiseBuffer;
  noiseFilter.type = 'highpass';
  noiseFilter.frequency.value = 2000;
  
  noiseGain.gain.setValueAtTime(0.15, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
  
  noiseSource.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);
  
  noiseSource.start(now);
}

function triggerClickFlash() {
  const guideLine = document.getElementById('guideLine');
  const rings = document.querySelectorAll('.ring');
  
  guideLine.classList.add('click-flash');
  rings.forEach(ring => ring.classList.add('click-flash'));
  
  setTimeout(() => {
    guideLine.classList.remove('click-flash');
    rings.forEach(ring => ring.classList.remove('click-flash'));
  }, 150);
  
  if (navigator.vibrate) navigator.vibrate([30, 20, 30]);
}

function startClickLoop() {
  if (clickInterval) clearInterval(clickInterval);
  clickInterval = setInterval(() => {
    if (!isRunning) return;
    playMechanicalClick();
    triggerClickFlash();
  }, CLICK_INTERVAL_MS);
}

function stopClickLoop() {
  if (clickInterval) {
    clearInterval(clickInterval);
    clickInterval = null;
  }
}

// ==================== RING INITIALIZATION ====================
function initRings() {
  // 11 radii (dari terluar ke terdalam) - Ditambahkan nilai baru di index 0
  const radii = [395, 355, 320, 290, 260, 230, 200, 170, 140, 112, 85];
  const tickRadii = [410, 370, 335, 305, 275, 245, 215, 185, 155, 125, 95];
  
  // Loop diubah dari r < 10 menjadi r < 11
  for (let r = 0; r < 11; r++) {
    const ring = document.getElementById(`ring-${r === 10 ? 10 : (9 - r)}`); 
    // Penyesuaian mapping ID: 
    // r=0 -> id="ring-10" (terluar baru)
    // r=1 -> id="ring-0" (ring-9 class)
    // ...
    // r=10 -> id="ring-9" (ring-0 class, terdalam)
    
    // Cara mapping yang lebih aman dan eksplisit berdasarkan ID HTML:
    const targetId = r === 0 ? 'ring-10' : `ring-${r - 1}`;
    const actualRing = document.getElementById(targetId);
    
    const radius = radii[r];
    const tickRadius = tickRadii[r];
    const offset = RING_OFFSETS[r];

    for (let i = 0; i < TICKS_PER_RING; i++) {
      const angle = (i * 360 / TICKS_PER_RING) - 90;
      const rad = (angle * Math.PI) / 180;
      const x = Math.cos(rad) * tickRadius;
      const y = Math.sin(rad) * tickRadius;

      const tick = document.createElement('div');
      tick.className = `tick ${i % 5 === 0 ? 'major' : ''}`;
      tick.style.left = `calc(50% + ${x}px - 0.5px)`;
      tick.style.top = `calc(50% + ${y}px - 3px)`;
      tick.style.transform = `rotate(${angle + 90}deg)`;
      actualRing.appendChild(tick);
    }

    for (let i = 0; i < CHARS_PER_RING; i++) {
      const charIndex = (i + offset) % CHARS.length;
      const angle = (i * 360 / CHARS_PER_RING) - 90;
      const rad = (angle * Math.PI) / 180;
      const x = Math.cos(rad) * radius;
      const y = Math.sin(rad) * radius;

      const charEl = document.createElement('div');
      charEl.className = 'ring-char';
      charEl.textContent = CHARS[charIndex];
      charEl.dataset.index = i;
      charEl.style.left = `calc(50% + ${x}px - 6px)`;
      charEl.style.top = `calc(50% + ${y}px - 8px)`;
      actualRing.appendChild(charEl);
    }
  }
}

function updateHighlights(timestamp) {
  if (!isRunning) return;
  if (!startTime) startTime = timestamp;
  const elapsed = timestamp - startTime;

  // Mengambil semua 11 ring
  const rings = document.querySelectorAll('.ring');
  
  rings.forEach((ring, r) => {
    const oldHighlight = ring.querySelector('.ring-char.highlight');
    if (oldHighlight) oldHighlight.classList.remove('highlight');
    
    let currentAngle = (elapsed * RING_SPEEDS[r]) % 360;
    if (currentAngle < 0) currentAngle += 360;
    
    const anglePerChar = 360 / CHARS_PER_RING;
    let rawIndex = -currentAngle / anglePerChar;
    let highlightIndex = Math.round(rawIndex) % CHARS_PER_RING;
    if (highlightIndex < 0) highlightIndex += CHARS_PER_RING;
    
    const chars = ring.querySelectorAll('.ring-char');
    if (chars[highlightIndex]) {
      chars[highlightIndex].classList.add('highlight');
    }
  });

  animationFrameId = requestAnimationFrame(updateHighlights);
}

function toggleValidator() {
  initAudio();
  
  isRunning = !isRunning;
  const btn = document.getElementById('powerBtn');
  const center = document.getElementById('centerDisplay');
  const guideLine = document.getElementById('guideLine');
  const rings = document.querySelectorAll('.ring');

  if (isRunning) {
    btn.classList.add('running');
    center.classList.add('running');
    guideLine.classList.add('active');
    rings.forEach(ring => ring.classList.add('running'));

    startTime = 0;
    animationFrameId = requestAnimationFrame(updateHighlights);
    startClickLoop();
    
    setTimeout(() => {
      playMechanicalClick();
      triggerClickFlash();
    }, 300);

    if (navigator.vibrate) navigator.vibrate(100);

  } else {
    btn.classList.remove('running');
    center.classList.remove('running');
    guideLine.classList.remove('active');
    rings.forEach(ring => {
      ring.classList.remove('running');
      ring.style.transform = ''; 
      ring.querySelectorAll('.ring-char.highlight').forEach(el => el.classList.remove('highlight'));
    });

    if (animationFrameId) {
      cancelAnimationFrame(animationFrameId);
      animationFrameId = null;
    }
    
    stopClickLoop();
  }
}

initRings();
</script>

</body>
</html>
